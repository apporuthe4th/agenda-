<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" type="text/css" href="style.css" />

    <script src="main.js" defer></script>

    <title>Calendar</title>
  </head>
  <body>
    <main class="calendar">
      <header class="header">
        <button id="previous-month" type="button" aria-label="Previous month">
          &lt;
        </button>
        <h1 id="month-title" aria-live="polite"></h1>
        <button id="next-month" type="button" aria-label="Next month">
          &gt;
        </button>
      </header>
      <section class="inner-calendar" aria-label="Calendar">
        <ol class="weekdays" aria-hidden="true">
          <li>Monday</li>
          <li>Tuesday</li>
          <li>Wednesday</li>
          <li>Thursday</li>
          <li>Friday</li>
          <li>Saturday</li>
          <li>Sunday</li>
        </ol>
        <ol id="days" class="days" aria-label="Days of the month"></ol>
      </section>
    </main>
  </body>
</html>
